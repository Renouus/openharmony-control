services:
  # Credential rotation: edit the ignored deploy/mqtt/.env, then run
  # `docker compose down` followed by `docker compose up -d mqtt` so the
  # broker is recreated and reloads the atomically replaced password file.
  # Do not use `down -v`; the named data and secrets volumes are preserved.
  mqtt-credentials:
    image: eclipse-mosquitto:2
    user: "0:0"
    env_file:
      - deploy/mqtt/.env
    entrypoint: ["/bin/sh", "/mosquitto/config/init-credentials.sh"]
    volumes:
      - ./deploy/mqtt/init-credentials.sh:/mosquitto/config/init-credentials.sh:ro
      - mqtt-secrets:/mosquitto/secrets

  mqtt:
    image: eclipse-mosquitto:2
    depends_on:
      mqtt-credentials:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./deploy/mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./deploy/mqtt/acl:/mosquitto/config/acl:ro
      - mqtt-secrets:/mosquitto/secrets:ro
      - mqtt-data:/mosquitto/data

volumes:
  mqtt-secrets:
  mqtt-data:
