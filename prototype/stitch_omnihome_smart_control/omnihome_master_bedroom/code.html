<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>

<style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body min-h-screen pb-24">
<!-- TopAppBar JSON Component -->
<header class="w-full top-0 sticky bg-background dark:bg-background z-40 transition-shadow duration-300" id="top-nav">
<div class="flex justify-between items-center px-6 py-4 w-full">
<button aria-label="Menu" class="hover:opacity-80 transition-opacity active:scale-95 text-primary dark:text-primary-fixed-dim p-2 -ml-2 rounded-full">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="font-headline text-2xl font-bold text-primary dark:text-primary-fixed-dim tracking-tight">Master Bedroom</h1>
<button aria-label="Settings" class="hover:opacity-80 transition-opacity active:scale-95 text-primary dark:text-primary-fixed-dim p-2 -mr-2 rounded-full">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</div>
</header>
<main class="px-6 max-w-4xl mx-auto">
<!-- Status & Hero -->
<section class="mt-4 mb-8 relative rounded-3xl overflow-hidden shadow-[0_2px_16px_rgba(58,48,42,0.04)]">
<div class="absolute inset-0 bg-gradient-to-t from-surface-container-high/90 to-transparent z-10"></div>
<img alt="Luxury Bedroom" class="w-full h-64 object-cover object-center" data-alt="A soft-focus, warm-toned photograph of a minimalist luxury bedroom. The room is bathed in golden hour light, casting gentle, sun-baked shadows across crisp linen bedding in earthy burnt sienna and warm white tones. The aesthetic is serene, elegant, and deeply calming, perfectly embodying a warm minimalist design language. Elegant EB Garamond-inspired typography would feel perfectly at home here." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDE7l3W349GFP_mmhibAOrY9dPCeZEaPT7ZXi0Gx6A3qEEToOFL3UA-XkL8IOk8IfXzVjOKrOa1aAz1LRdqSt-rnnwZQ545pyzven_B4ey86N4GQ_SgQjdYGJMkvW7pnkTSmG7vEgb26cdx-PkSkidkPy4B9vlUdMKsIJkMQZ66PXgLCItrAmdajeJnx9QQX8SEYTZXuVe20S9lBo4_gbbYXCfVCtiPAf2ojiRONKTwYdIgBOv-NUY9Bq1Uggif3-LznzEbTHGwFDw"/>
<div class="absolute bottom-0 left-0 p-6 z-20 w-full flex justify-between items-end">
<div>
<h2 class="font-headline text-3xl text-on-surface mb-1">Night Mode</h2>
<p class="font-label text-sm text-on-surface-variant font-medium">2 Devices On • 20°C</p>
</div>
<div class="bg-surface/80 backdrop-blur-md rounded-full px-4 py-2 flex items-center space-x-2 border border-outline-variant/60">
<span class="material-symbols-outlined text-primary text-xl" data-icon="thermostat">thermostat</span>
<span class="font-label font-bold text-primary">20°</span>
</div>
</div>
</section>
<!-- Atmosphere Scenes -->
<section class="mb-10">
<div class="flex items-center justify-between mb-4">
<h3 class="font-headline text-xl text-on-surface font-semibold">Atmosphere</h3>
</div>
<div class="flex space-x-3 overflow-x-auto no-scrollbar pb-2">
<!-- Inactive Chip -->
<button class="flex-shrink-0 flex items-center space-x-2 bg-surface-container-low border border-outline-variant/60 text-on-surface-variant rounded-full px-5 py-2.5 transition-all hover:bg-surface-container hover:text-primary">
<span class="material-symbols-outlined text-lg" data-icon="bedtime">bedtime</span>
<span class="font-label text-sm font-medium">Sleep</span>
</button>
<!-- Inactive Chip -->
<button class="flex-shrink-0 flex items-center space-x-2 bg-surface-container-low border border-outline-variant/60 text-on-surface-variant rounded-full px-5 py-2.5 transition-all hover:bg-surface-container hover:text-primary">
<span class="material-symbols-outlined text-lg" data-icon="menu_book">menu_book</span>
<span class="font-label text-sm font-medium">Reading</span>
</button>
<!-- Inactive Chip -->
<button class="flex-shrink-0 flex items-center space-x-2 bg-surface-container-low border border-outline-variant/60 text-on-surface-variant rounded-full px-5 py-2.5 transition-all hover:bg-surface-container hover:text-primary">
<span class="material-symbols-outlined text-lg" data-icon="wb_sunny">wb_sunny</span>
<span class="font-label text-sm font-medium">Wake Up</span>
</button>
<!-- Active Chip -->
<button class="flex-shrink-0 flex items-center space-x-2 bg-primary text-on-primary rounded-full px-5 py-2.5 transition-all shadow-[0_4px_14px_rgba(150,68,7,0.2)]">
<span class="material-symbols-outlined text-lg" data-icon="nights_stay">nights_stay</span>
<span class="font-label text-sm font-medium">Night</span>
</button>
</div>
</section>
<!-- Devices Grid -->
<section>
<h3 class="font-headline text-xl text-on-surface font-semibold mb-4">Devices</h3>
<div class="grid grid-cols-2 gap-4">
<!-- Device: Ceiling Fan (Off) -->
<div class="bg-surface-container-low rounded-2xl p-5 border border-outline-variant/40 flex flex-col justify-between h-40 transition-all hover:shadow-[0_2px_16px_rgba(58,48,42,0.06)] cursor-pointer">
<div class="flex justify-between items-start">
<div class="bg-surface-variant p-2.5 rounded-full text-secondary">
<span class="material-symbols-outlined" data-icon="mode_fan">mode_fan</span>
</div>
<div class="w-10 h-6 bg-surface-variant rounded-full p-1 transition-colors duration-200 ease-in-out">
<div class="w-4 h-4 bg-on-surface-variant rounded-full transform translate-x-0 transition-transform duration-200 ease-in-out"></div>
</div>
</div>
<div>
<h4 class="font-label font-semibold text-on-surface mb-0.5">Ceiling Fan</h4>
<p class="font-label text-xs text-on-surface-variant">Off</p>
</div>
</div>
<!-- Device: Dimmable Lights (On) -->
<div class="bg-primary-container rounded-2xl p-5 border border-primary/20 flex flex-col justify-between h-40 transition-all shadow-[0_4px_16px_rgba(150,68,7,0.1)] cursor-pointer">
<div class="flex justify-between items-start">
<div class="bg-primary p-2.5 rounded-full text-on-primary shadow-sm">
<span class="material-symbols-outlined" data-icon="lightbulb" data-weight="fill" style="font-variation-settings: 'FILL' 1;">lightbulb</span>
</div>
<div class="w-10 h-6 bg-primary rounded-full p-1 transition-colors duration-200 ease-in-out">
<div class="w-4 h-4 bg-on-primary rounded-full transform translate-x-4 transition-transform duration-200 ease-in-out shadow-sm"></div>
</div>
</div>
<div>
<h4 class="font-label font-semibold text-on-primary-container mb-0.5">Dimmable Lights</h4>
<p class="font-label text-xs text-primary-fixed-dim">On • 40%</p>
</div>
</div>
<!-- Device: Blackout Blinds (Closed) -->
<div class="bg-surface-container-low rounded-2xl p-5 border border-outline-variant/40 flex flex-col justify-between h-40 transition-all hover:shadow-[0_2px_16px_rgba(58,48,42,0.06)] cursor-pointer">
<div class="flex justify-between items-start">
<div class="bg-surface-variant p-2.5 rounded-full text-secondary">
<span class="material-symbols-outlined" data-icon="blinds_closed">blinds_closed</span>
</div>
<div class="w-10 h-6 bg-surface-variant rounded-full p-1 transition-colors duration-200 ease-in-out">
<div class="w-4 h-4 bg-on-surface-variant rounded-full transform translate-x-0 transition-transform duration-200 ease-in-out"></div>
</div>
</div>
<div>
<h4 class="font-label font-semibold text-on-surface mb-0.5">Blackout Blinds</h4>
<p class="font-label text-xs text-on-surface-variant">Closed</p>
</div>
</div>
<!-- Device: Air Purifier (Auto) -->
<div class="bg-primary-container rounded-2xl p-5 border border-primary/20 flex flex-col justify-between h-40 transition-all shadow-[0_4px_16px_rgba(150,68,7,0.1)] cursor-pointer">
<div class="flex justify-between items-start">
<div class="bg-primary p-2.5 rounded-full text-on-primary shadow-sm">
<span class="material-symbols-outlined" data-icon="air" data-weight="fill" style="font-variation-settings: 'FILL' 1;">air</span>
</div>
<div class="w-10 h-6 bg-primary rounded-full p-1 transition-colors duration-200 ease-in-out">
<div class="w-4 h-4 bg-on-primary rounded-full transform translate-x-4 transition-transform duration-200 ease-in-out shadow-sm"></div>
</div>
</div>
<div>
<h4 class="font-label font-semibold text-on-primary-container mb-0.5">Air Purifier</h4>
<p class="font-label text-xs text-primary-fixed-dim">Auto • Good</p>
</div>
</div>
</div>
</section>
</main>
<!-- BottomNavBar JSON Component - Suppressed based on semantic shell logic (This is a focused control page, arguably a 'sub-page' of 'Home', but leaving it as it might be a top-level tab context in some interpretations. Given instructions, a room detail page often shouldn't have global nav, but if it's the main 'Scenes' or 'Home' view acting as a room... Wait, "Master Bedroom" is likely a deep link from "Home". I will include the nav but set "Home" as active per hierarchy, though often deep links suppress it. Let's include it to satisfy the JSON requirement if it's considered a primary hub, but actually, the prompt says "room-specific control page" which implies a sub-level. I'll include it to be safe and match the JSON, setting 'Home' active.) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-6 pt-3 bg-surface-container-low dark:bg-surface-container-low border-t border-outline-variant/60 shadow-[0_-2px_16px_rgba(58,48,42,0.04)] rounded-t-xl md:hidden">
<!-- Home (Active) -->
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-lg px-4 py-1.5 active:scale-90 transition-all duration-200 hover:text-primary dark:hover:text-primary-fixed-dim">
<span class="material-symbols-outlined" data-icon="home" data-weight="fill" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-label text-xs uppercase tracking-wider mt-1">Home</span>
</button>
<!-- Scenes -->
<button class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim px-4 py-1.5 active:scale-90 transition-all duration-200 hover:text-primary dark:hover:text-primary-fixed-dim">
<span class="material-symbols-outlined" data-icon="palette">palette</span>
<span class="font-label text-xs uppercase tracking-wider mt-1">Scenes</span>
</button>
<!-- Health -->
<button class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim px-4 py-1.5 active:scale-90 transition-all duration-200 hover:text-primary dark:hover:text-primary-fixed-dim">
<span class="material-symbols-outlined" data-icon="favorite">favorite</span>
<span class="font-label text-xs uppercase tracking-wider mt-1">Health</span>
</button>
<!-- Family -->
<button class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim px-4 py-1.5 active:scale-90 transition-all duration-200 hover:text-primary dark:hover:text-primary-fixed-dim">
<span class="material-symbols-outlined" data-icon="group">group</span>
<span class="font-label text-xs uppercase tracking-wider mt-1">Family</span>
</button>
</nav>
<script>
        // Simple JS to add a subtle shadow to top nav on scroll
        window.addEventListener('scroll', () => {
            const nav = document.getElementById('top-nav');
            if (window.scrollY > 10) {
                nav.classList.add('shadow-[0_2px_16px_rgba(58,48,42,0.04)]');
            } else {
                nav.classList.remove('shadow-[0_2px_16px_rgba(58,48,42,0.04)]');
            }
        });
    </script>
</body></html>
