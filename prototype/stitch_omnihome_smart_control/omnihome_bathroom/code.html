<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-background dark:bg-background z-40 transition-shadow" id="top-app-bar">
<div class="flex justify-between items-center px-6 py-4 w-full">

</section>

<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">wb_sunny</span>

<p class="font-label text-xs text-secondary mt-1 uppercase tracking-wide">Off</p>
</div>
</div>
<!-- Device: Heated Floor -->

<div class="w-10 h-6 bg-surface-variant rounded-full p-1 transition-colors flex items-center">

</div>
</div>

<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant group-hover:text-primary transition-colors">

<div class="absolute inset-0 bg-primary/5 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none"></div>
<div class="flex justify-between items-start relative z-10">
<div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center text-primary">

<div class="w-10 h-6 bg-primary-container rounded-full p-1 transition-colors flex items-center justify-end">
<div class="w-4 h-4 bg-on-primary-container rounded-full shadow-sm"></div>
</div>
</div>
<div class="relative z-10">
<h3 class="font-body font-semibold text-on-background">Water Heater</h3>
<p class="font-label text-xs text-primary mt-1 uppercase tracking-wide">Ready</p>

</div>
</div>
</section>

<nav class="fixed bottom-0 w-full z-50 rounded-t-xl md:hidden">
<div class="border-t border-outline-variant/60 dark:border-outline-variant/60 shadow-[0_-2px_16px_rgba(58,48,42,0.04)] bg-surface-container-low dark:bg-surface-container-low fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-6 pt-3">
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-lg px-4 py-1.5 active:scale-90 transition-all duration-200">

<button class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim px-4 py-1.5 hover:text-primary dark:hover:text-primary-fixed-dim transition-colors active:scale-90 transition-all duration-200">

<span class="font-label text-xs uppercase tracking-wider mt-1">Scenes</span>

<button class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim px-4 py-1.5 hover:text-primary dark:hover:text-primary-fixed-dim transition-colors active:scale-90 transition-all duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">favorite</span>

<button class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim px-4 py-1.5 hover:text-primary dark:hover:text-primary-fixed-dim transition-colors active:scale-90 transition-all duration-200">

<script>
        // Simple scroll shadow effect for TopAppBar
        const topAppBar = document.getElementById('top-app-bar');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 10) {
                topAppBar.classList.add('shadow-[0_2px_16px_rgba(58,48,42,0.08)]');
            } else {
                topAppBar.classList.remove('shadow-[0_2px_16px_rgba(58,48,42,0.08)]');
            }
        });
    </script>
