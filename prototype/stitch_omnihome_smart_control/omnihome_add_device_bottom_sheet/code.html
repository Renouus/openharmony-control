        .scan-line {

            animation: scan 2s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* Bottom Sheet Animation */
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }

<script>
        // Simple script to handle backdrop click to 'close' (just visual for this demo)
        document.getElementById('backdrop').addEventListener('click', function() {
            const sheet = document.querySelector('.bottom-sheet');
            sheet.style.animation = 'none'; // reset
            // In a real app, you'd trigger a slide down animation here before removing the DOM node
            sheet.style.transform = 'translateY(100%)';
            sheet.style.transition = 'transform 0.3s ease-in';
            this.style.opacity = '0';
            setTimeout(() => {
                // Just dimming for demonstration of closing interaction
                alert('Close action triggered');
                sheet.style.transform = 'translateY(0)';
                this.style.opacity = '1';
            }, 300);
        });
    </script>
