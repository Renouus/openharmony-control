<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>OmniHome - Climate Control</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600;700;800&amp;family=Manrope:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-container": "#fbe8d8",
                        "inverse-on-surface": "#faf5ee",
                        "primary-container": "#e08850",
                        "on-tertiary-container": "#3a2020",
                        "error": "#c0392b",
                        "secondary": "#78706a",
                        "tertiary": "#8c3c3c",
                        "on-error-container": "#7a1a10",
                        "surface-container": "#f2ece4",
                        "surface": "#faf5ee",
                        "surface-bright": "#faf5ee",
                        "on-tertiary-fixed": "#2e1515",
                        "on-surface-variant": "#453c35",
                        "on-primary": "#ffffff",
                        "secondary-container": "#eae2da",
                        "on-primary-fixed": "#401a08",
                        "on-secondary-container": "#605850",
                        "on-error": "#ffffff",
                        "primary-fixed-dim": "#f0a878",
                        "inverse-primary": "#f0a878",
                        "secondary-fixed": "#eae2da",
                        "on-secondary-fixed-variant": "#504840",
                        "primary-fixed": "#fbe8d8",
                        "tertiary-container": "#d47070",
                        "on-surface": "#3a302a",
                        "surface-container-highest": "#e6e0d6",
                        "surface-container-low": "#f6f0e8",
                        "outline-variant": "#d8d0c8",
                        "inverse-surface": "#3a302a",
                        "tertiary-fixed": "#fce0e0",
                        "primary": "#c2652a",
                        "on-tertiary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "outline": "#9a9088",
                        "error-container": "#fce4e0",
                        "on-secondary-fixed": "#2a2420",
                        "on-background": "#3a302a",
                        "tertiary-fixed-dim": "#e8a0a0",
                        "on-secondary": "#ffffff",
                        "background": "#faf5ee",
                        "secondary-fixed-dim": "#cec6be",
                        "surface-dim": "#dcd6cc",
                        "on-primary-fixed-variant": "#8a4518",
                        "on-tertiary-fixed-variant": "#6e3030",
                        "surface-variant": "#ece6dc",
                        "surface-container-high": "#ece6dc",
                        "surface-tint": "#c2652a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["EB Garamond", "serif"],
                        "display": ["EB Garamond", "serif"],
                        "body": ["Manrope", "sans-serif"],
                        "label": ["Manrope", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Manrope', sans-serif; background-color: #faf5ee; color: #3a302a; }
        h1, h2, h3, h4, h5, h6, .font-headline, .font-display { font-family: 'EB Garamond', serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24; }
        .icon-fill { font-variation-settings: 'FILL' 1, 'wght' 300, 'GRAD' 0, 'opsz' 24; }
        
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d8d0c8; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #c2652a; }
        
        .thermostat-dial {
            background: conic-gradient(from 225deg, #c2652a 0%, #c2652a 75%, #ece6dc 75%, #ece6dc 100%);
            border-radius: 50%;
            position: relative;
            box-shadow: inset 0 2px 16px rgba(58, 48, 42, 0.04);
        }
        .thermostat-inner {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 85%; height: 85%;
            background-color: #faf5ee;
            border-radius: 50%;
            box-shadow: 0 4px 24px rgba(58, 48, 42, 0.06);
        }
    </style>
<style>
        body { min-height: max(884px, 100dvh); }
    </style>
</head>
<body class="bg-background text-on-background antialiased min-h-screen flex flex-col pb-24 md:pb-0">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-background z-40 border-b border-outline-variant/60 flex items-center justify-between px-6 py-4">
<div class="flex items-center gap-4">
<button class="p-2 -ml-2 rounded-full hover:bg-surface-container-high transition-colors active:scale-95 text-primary">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<div class="flex flex-col">
<span class="font-label text-[10px] uppercase tracking-[0.2em] text-primary/80 font-bold">OmniHome</span>
<h1 class="font-headline text-2xl font-bold tracking-tight text-on-surface -mt-1">Climate Control</h1>
</div>
</div>
<div class="flex items-center gap-3">
<button class="p-2 rounded-full hover:bg-surface-container-high transition-colors active:scale-95 text-on-surface-variant">
<span class="material-symbols-outlined">more_vert</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center px-6 pt-6 pb-12 md:max-w-4xl md:mx-auto w-full">
<!-- Status Header (Current Readings) -->
<section class="w-full mb-10 flex justify-between items-end">
<div>
<p class="font-label text-sm text-on-surface-variant uppercase tracking-wider mb-1 font-bold">Living Room</p>
<div class="flex items-baseline gap-2">
<span class="font-display text-7xl font-semibold tracking-tighter text-on-surface">72°</span>
<span class="font-body text-xl text-on-surface-variant font-medium">Indoor</span>
</div>
</div>
<div class="text-right">
<div class="flex items-center justify-end gap-1 text-on-surface-variant mb-1">
<span class="material-symbols-outlined text-sm font-bold">water_drop</span>
<span class="font-label text-sm uppercase tracking-wider font-bold">Humidity</span>
</div>
<span class="font-display text-4xl font-semibold text-on-surface">45%</span>
</div>
</section>
<!-- Main Thermostat Dial Area -->
<section class="w-full flex flex-col items-center mb-12">
<div class="relative flex items-center justify-center">
<!-- Decorative rings -->
<div class="absolute inset-0 m-auto w-[280px] h-[280px] rounded-full border border-outline-variant/40"></div>
<div class="absolute inset-0 m-auto w-[320px] h-[320px] rounded-full border border-outline-variant/20"></div>
<!-- Active Dial -->
<div class="thermostat-dial w-[240px] h-[240px] relative z-10 flex items-center justify-center cursor-pointer hover:scale-[1.02] transition-transform duration-300">
<div class="thermostat-inner flex flex-col items-center justify-center text-center">
<span class="font-label text-[10px] text-on-surface-variant uppercase tracking-widest mb-1 font-bold">Current 72°</span>
<span class="font-display text-6xl font-bold text-primary tracking-tighter leading-none">74°</span>
<span class="font-label text-[10px] text-on-surface-variant uppercase tracking-widest mt-1 font-bold">Target</span>
<div class="flex items-center gap-1 mt-3 text-primary">
<span class="material-symbols-outlined text-sm icon-fill">mode_heat</span>
<span class="font-body text-xs font-bold uppercase tracking-wide">Heating</span>
</div>
<button class="mt-4 p-2 rounded-full hover:bg-surface-container-high transition-colors active:scale-90 text-on-surface-variant/60 flex items-center justify-center border border-outline-variant/30">
    <span class="material-symbols-outlined text-lg">power_settings_new</span>
</button></div>
<!-- Dial Knob Indicator -->
<div class="absolute top-[10%] right-[15%] w-4 h-4 bg-primary rounded-full border-2 border-surface shadow-sm"></div>
</div>
</div>
<p class="mt-8 font-body text-sm font-semibold text-on-surface-variant/80 italic">Heating steadily</p>
</section>
<!-- Mode Selectors -->
<section class="w-full max-w-md mb-12">
<div class="bg-surface-container-low rounded-2xl p-2 flex gap-2 shadow-[0_2px_16px_rgba(58,48,42,0.04)] border border-outline-variant/30 justify-around">
<button class="flex-1 min-h-[44px] py-4 px-2 rounded-xl flex flex-col items-center justify-center gap-1 active:scale-95 transition-all bg-primary text-white shadow-md">
<span class="material-symbols-outlined icon-fill">mode_heat</span>
<span class="font-label text-xs font-bold tracking-wide">Heat</span>
</button>
<button class="flex-1 min-h-[44px] py-4 px-2 rounded-xl flex flex-col items-center justify-center gap-1 active:scale-95 transition-all hover:bg-surface-container-high text-on-surface-variant">
<span class="material-symbols-outlined">ac_unit</span>
<span class="font-label text-xs font-bold tracking-wide">Cool</span>
</button>
<button class="flex-1 min-h-[44px] py-4 px-2 rounded-xl flex flex-col items-center justify-center gap-1 active:scale-95 transition-all hover:bg-surface-container-high text-on-surface-variant">
<span class="material-symbols-outlined">autorenew</span>
<span class="font-label text-xs font-bold tracking-wide">Auto</span>
</button>

</div>
</section>
<!-- Weekly Usage Graph -->
<section class="w-full">
<div class="flex justify-between items-end mb-4">
<h3 class="font-headline text-xl text-on-surface font-bold">Weekly Usage</h3>
<span class="font-body text-sm text-on-surface-variant font-bold">32 hrs total</span>
</div>
<div class="bg-surface-container-lowest rounded-2xl p-6 border border-outline-variant/40 shadow-[0_4px_20px_rgba(58,48,42,0.04)]">
<div class="flex items-end justify-between h-32 gap-3 mb-2">
<!-- Graph Bars -->
<div class="flex-1 flex flex-col justify-end items-center gap-3">
<div class="w-full bg-surface-container-high rounded-t-md h-[40%]"></div>
<span class="font-label text-xs text-on-surface-variant font-bold">M</span>
</div>
<div class="flex-1 flex flex-col justify-end items-center gap-3">
<div class="w-full bg-surface-container-high rounded-t-md h-[65%]"></div>
<span class="font-label text-xs text-on-surface-variant font-bold">T</span>
</div>
<div class="flex-1 flex flex-col justify-end items-center gap-3">
<div class="w-full bg-primary rounded-t-md h-[85%] shadow-sm"></div>
<span class="font-label text-xs text-primary font-bold">W</span>
</div>
<div class="flex-1 flex flex-col justify-end items-center gap-3">
<div class="w-full bg-surface-container-high rounded-t-md h-[50%]"></div>
<span class="font-label text-xs text-on-surface-variant font-bold">T</span>
</div>
<div class="flex-1 flex flex-col justify-end items-center gap-3">
<div class="w-full bg-surface-container-high rounded-t-md h-[30%]"></div>
<span class="font-label text-xs text-on-surface-variant font-bold">F</span>
</div>
<div class="flex-1 flex flex-col justify-end items-center gap-3">
<div class="w-full bg-surface-container-high rounded-t-md h-[20%]"></div>
<span class="font-label text-xs text-on-surface-variant font-bold">S</span>
</div>
<div class="flex-1 flex flex-col justify-end items-center gap-3">
<div class="w-full bg-surface-container-high rounded-t-md h-[45%]"></div>
<span class="font-label text-xs text-on-surface-variant font-bold">S</span>
</div>
</div>
</div>
</section>
</main>
<!-- Bottom Navigation -->
<nav class="fixed bottom-0 left-0 right-0 bg-surface/90 backdrop-blur-md border-t border-outline-variant/40 px-6 py-3 flex justify-between items-center z-50">
<button class="flex flex-col items-center gap-1 text-on-surface-variant">
<span class="material-symbols-outlined">home</span>
<span class="text-[10px] font-bold uppercase tracking-tighter">Home</span>
</button>
<button class="flex flex-col items-center gap-1 text-primary">
<span class="material-symbols-outlined icon-fill">grid_view</span>
<span class="text-[10px] font-bold uppercase tracking-tighter">Devices</span>
</button>
<button class="flex flex-col items-center gap-1 text-on-surface-variant">
<span class="material-symbols-outlined">schedule</span>
<span class="text-[10px] font-bold uppercase tracking-tighter">Schedule</span>
</button>
<button class="flex flex-col items-center gap-1 text-on-surface-variant">
<span class="material-symbols-outlined">settings</span>
<span class="text-[10px] font-bold uppercase tracking-tighter">Settings</span>
</button>
</nav>


</body></html>
